# 域名写死为 harness.alltman.com。
# nginx 不会展开 Compose 环境变量，单域名直接写死，避免再挂一层 envsubst。
# 旧证书 docker/nginx/ssl/llmops.crt、llmops.key 不再引用。

server {
    listen 80;
    server_name harness.alltman.com;

    # ACME HTTP-01 必须在 301 之前放行
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name harness.alltman.com;

    ssl_certificate /etc/letsencrypt/live/harness.alltman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harness.alltman.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 内部接口只服务间访问：放行 WS 网关所在机器与容器内网，其余一律拒绝
    location ^~ /api/internal/ {
        allow 47.110.243.159;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://api:5001;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/proxy.conf;
    }

    # /api 去掉前缀后转到 api:5001
    location /api/ {
        proxy_pass http://api:5001;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/proxy.conf;
    }

    # PWA manifest：默认 mime.types 没有 webmanifest，上游会按 octet-stream 返回，
    # 浏览器按 octet-stream 处理会忽略 manifest（iOS/Chrome 都认），这里强制改写。
    location = /manifest.webmanifest {
        proxy_pass http://ui:3000;
        include /etc/nginx/proxy.conf;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/manifest+json" always;
    }

    # 页面转到 ui:3000
    location / {
        proxy_pass http://ui:3000;
        include /etc/nginx/proxy.conf;
    }
}
