# Harness Mate 单机部署（ui / api / postgres / redis / nginx / certbot）
# 变量全部来自同目录 .env，本文件不写明文。
#
# 域名在 nginx 配置里写死，不在这里生成 nginx 配置。
# DOMAIN、CERTBOT_EMAIL 只交给 certbot 容器。
#
# 首次签发（只要跑一次）：
#   1. fullchain.pem 不存在时，443 那段配置会让 nginx 起不来，80 也不会听。
#      先把 nginx/conf.d/default.conf 里 listen 443 的 server 整段注释掉。
#   2. docker compose up -d nginx
#   3. docker compose run --rm --entrypoint /bin/sh certbot -c \
#        'certbot certonly --webroot -w /var/www/certbot -d "$DOMAIN" --email "$CERTBOT_EMAIL" --agree-tos -n'
#   4. 恢复 443 的 server，再执行 docker compose restart nginx
# 之后由下面的 certbot 服务每 12 小时续期。续期成功后执行：
#   docker compose exec nginx nginx -s reload

name: harness-mate

services:
  ui:
    image: harness-ui:local
    build: ../ui
    container_name: harness-ui
    restart: always
    expose:
      - "3000"

  api:
    image: harness-api:local
    build: ../api
    container_name: harness-api
    restart: always
    environment:
      FLASK_ENV: "${FLASK_ENV}"
      FLASK_DEBUG: "${FLASK_DEBUG}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      WTF_CSRF_ENABLED: "${WTF_CSRF_ENABLED}"
      SQLALCHEMY_DATABASE_URI: "${SQLALCHEMY_DATABASE_URI}"
      SQLALCHEMY_POOL_SIZE: "${SQLALCHEMY_POOL_SIZE}"
      SQLALCHEMY_POOL_RECYCLE: "${SQLALCHEMY_POOL_RECYCLE}"
      SQLALCHEMY_ECHO: "${SQLALCHEMY_ECHO}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      REDIS_USERNAME: "${REDIS_USERNAME}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB}"
      REDIS_USE_SSL: "${REDIS_USE_SSL}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_REDIRECT_URI: "${GITHUB_REDIRECT_URI}"
      COS_SECRET_ID: "${COS_SECRET_ID}"
      COS_SECRET_KEY: "${COS_SECRET_KEY}"
      COS_REGION: "${COS_REGION}"
      COS_SCHEME: "${COS_SCHEME}"
      COS_BUCKET: "${COS_BUCKET}"
      COS_DOMAIN: "${COS_DOMAIN}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USE_SSL: "${MAIL_USE_SSL}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_DEFAULT_SENDER: "${MAIL_DEFAULT_SENDER}"
      MAIL_SENDER_NAME: "${MAIL_SENDER_NAME}"
      MIGRATION_ENABLED: "${MIGRATION_ENABLED}"
      MODE: "${MODE}"
      SERVER_WORKER_AMOUNT: "${SERVER_WORKER_AMOUNT}"
      SERVER_THREAD_AMOUNT: "${SERVER_THREAD_AMOUNT}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT}"
    volumes:
      - ./volumes/app/storage:/app/api/storage
    expose:
      - "5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: harness-postgres
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGDATA: "${PGDATA}"
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data/pgdata
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:6-alpine
    container_name: harness-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./volumes/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: harness-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./volumes/certbot/conf:/etc/letsencrypt:ro
      - ./volumes/certbot/www:/var/www/certbot:ro
    depends_on:
      - ui
      - api

  certbot:
    image: certbot/certbot
    container_name: harness-certbot
    restart: always
    environment:
      DOMAIN: "${DOMAIN}"
      CERTBOT_EMAIL: "${CERTBOT_EMAIL}"
    volumes:
      - ./volumes/certbot/conf:/etc/letsencrypt
      - ./volumes/certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    depends_on:
      - nginx
